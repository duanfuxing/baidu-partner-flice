name: Build desktop packages

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            artifact: BaiduPartnerFlice-0.30.5-Windows-x64-Setup
            package: BaiduPartnerFlice-0.30.5-Windows-x64-Setup.exe
            platform: windows
            python_architecture: x64
            installer_script: packaging\windows-installer-x64.iss
          - os: windows-11-arm
            artifact: BaiduPartnerFlice-0.30.5-Windows-arm64-Setup
            package: BaiduPartnerFlice-0.30.5-Windows-arm64-Setup.exe
            platform: windows
            python_architecture: arm64
            installer_script: packaging\windows-installer-arm64.iss
          - os: macos-15
            artifact: BaiduPartnerFlice-0.30.5-macOS-arm64-Installer
            package: BaiduPartnerFlice-0.30.5-macOS-arm64-Installer.pkg
            platform: macos
            python_architecture: arm64
          - os: macos-15-intel
            artifact: BaiduPartnerFlice-0.30.5-macOS-x64-Installer
            package: BaiduPartnerFlice-0.30.5-macOS-x64-Installer.pkg
            platform: macos
            python_architecture: x64

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11.8"
          architecture: ${{ matrix.python_architecture }}
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Build desktop application
        run: python -m PyInstaller --noconfirm --clean packaging/BaiduPartnerFlice.spec

      - name: Self-check Windows application
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $process = Start-Process `
            -FilePath ".\dist\BaiduPartnerFlice\BaiduPartnerFlice.exe" `
            -ArgumentList "--self-check" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Desktop self-check failed with exit code $($process.ExitCode)"
          }

      - name: Self-check macOS application
        if: matrix.platform == 'macos'
        shell: bash
        run: dist/百度资质自动提交工具.app/Contents/MacOS/BaiduPartnerFlice --self-check

      - name: Build Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $iscc = Get-ChildItem `
            "${env:ProgramFiles(x86)}\Inno Setup *\ISCC.exe", `
            "$env:ProgramFiles\Inno Setup *\ISCC.exe" `
            -ErrorAction SilentlyContinue |
            Sort-Object FullName |
            Select-Object -Last 1
          if (-not $iscc) {
            throw "Inno Setup compiler ISCC.exe was not found"
          }
          & $iscc.FullName "${{ matrix.installer_script }}"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }
          Move-Item `
            "installer-output\BaiduPartnerFlice-0.30.5-Windows-Setup.exe" `
            "${{ matrix.package }}"

      - name: Build macOS installer
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          pkgbuild \
            --component \
            "dist/百度资质自动提交工具.app" \
            --install-location "/Applications" \
            --identifier "com.baidu.partner.flice" \
            --version "0.30.5" \
            "${{ matrix.package }}"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.package }}
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: BaiduPartnerFlice-*
          path: release
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "百度资质自动提交工具 $GITHUB_REF_NAME" \
            --generate-notes
